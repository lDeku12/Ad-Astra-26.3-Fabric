name: Ad Astra Fabric Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Ad-Astra-26.3-Fabric-port-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Extraer y localizar Ad Astra
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work
          unzip -q Ad-Astra-26.3-Fabric-port-source.zip -d work

          echo "Estructura del ZIP extraída con éxito."
          
          PROJECT_DIR=""
          for d in $(find work -type d -name "Ad-Astra" -o -name "*Ad-Astra*"); do
            if [ -f "$d/gradlew" ] && [ -d "$d/src" ]; then
              PROJECT_DIR="$d"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            for f in $(find work -name "gradlew" -type f); do
              DIR="$(dirname "$f")"
              if [ -d "$DIR/src" ]; then
                PROJECT_DIR="$DIR"
                break
              fi
            done
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se pudo identificar la raíz del proyecto Ad Astra."
            exit 1
          fi

          echo "Proyecto seleccionado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Corregir versiones de Fabric API en todo el proyecto
        shell: bash
        run: |
          set -euo pipefail
          echo "Reemplazando versiones problemáticas de fabric-api por 0.100.4+1.21..."
          find work -type f \( -name "*.gradle.kts" -o -name "*.gradle" -o -name "gradle.properties" \) | while read -r file; do
            sed -i 's/0.164.0+1.21/0.100.4+1.21/g' "$file" || true
            sed -i 's/0.164.0+26.3+26.3/0.100.4+1.21/g' "$file" || true
            sed -i 's/0.102.0+1.21/0.100.4+1.21/g' "$file" || true
          done

      - name: Inyectar repositorios universales
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="$PROJECT_DIR/build.gradle.kts"
          if [ -f "$BUILD_FILE" ]; then
            echo "Inyectando repositorios en $BUILD_FILE..."
            cat << 'EOF' >> "$BUILD_FILE"

repositories {
    mavenCentral()
    maven("https://maven.fabricmc.net/")
    maven("https://api.modrinth.com/maven")
    maven("https://maven.teamresourceful.com/repository/maven-public/")
    maven("https://maven.shedaniel.me/")
    maven("https://maven.blamejared.com/")
    maven("https://libraries.minecraft.net/")
}
EOF
          fi

      - name: Compilar Ad Astra
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          chmod +x ./gradlew

          echo "Compilando desde: $(pwd)"
          ./gradlew --no-daemon build --stacktrace

      - name: Mostrar JAR generados
        if: always()
        shell: bash
        run: |
          echo "JAR encontrados:"
          find work -type f -path '*/build/libs/*.jar' -print || true

      - name: Guardar JAR e informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-astra-fabric-26.3-build
          path: |
            work/**/build/libs/*.jar
            work/**/build/reports/**
            work/**/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
