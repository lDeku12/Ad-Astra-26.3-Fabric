name: Ad Astra Fabric Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Ad-Astra-26.3-Fabric-port-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Extraer y localizar Ad Astra
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          unzip -q Ad-Astra-26.3-Fabric-port-source.zip -d work
          
          PROJECT_DIR=""
          for d in $(find work -type d -name "Ad-Astra" -o -name "*Ad-Astra*"); do
            if [ -f "$d/gradlew" ] && [ -d "$d/src" ]; then
              PROJECT_DIR="$d"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            for f in $(find work -name "gradlew" -type f); do
              DIR="$(dirname "$f")"
              if [ -d "$DIR/src" ]; then
                PROJECT_DIR="$DIR"
                break
              fi
            done
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se pudo identificar la raíz del proyecto Ad Astra."
            exit 1
          fi

          echo "Proyecto seleccionado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Corregir versiones de Fabric API
        shell: bash
        run: |
          set -euo pipefail
          find work -type f \( -name "*.gradle.kts" -o -name "*.gradle" -o -name "gradle.properties" \) | while read -r file; do
            sed -i 's/0.164.0+1.21/0.100.4+1.21/g' "$file" || true
            sed -i 's/0.164.0+26.3+26.3/0.100.4+1.21/g' "$file" || true
            sed -i 's/0.102.0+1.21/0.100.4+1.21/g' "$file" || true
          done

      - name: Inyectar repositorios universales
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="$PROJECT_DIR/build.gradle.kts"
          if [ -f "$BUILD_FILE" ]; then
            echo "repositories {" >> "$BUILD_FILE"
            echo "    mavenCentral()" >> "$BUILD_FILE"
            echo "    maven(\"https://maven.fabricmc.net/\")" >> "$BUILD_FILE"
            echo "    maven(\"https://api.modrinth.com/maven\")" >> "$BUILD_FILE"
            echo "    maven(\"https://maven.teamresourceful.com/repository/maven-public/\")" >> "$BUILD_FILE"
            echo "    maven(\"https://maven.shedaniel.me/\")" >> "$BUILD_FILE"
            echo "    maven(\"https://maven.blamejared.com/\")" >> "$BUILD_FILE"
            echo "    maven(\"https://libraries.minecraft.net/\")" >> "$BUILD_FILE"
            echo "}" >> "$BUILD_FILE"
          fi

      - name: Compilar Ad Astra
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon build --stacktrace

      - name: Guardar JAR e informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-astra-fabric-26.3-build
          path: |
            work/**/build/libs/*.jar
            work/**/build/reports/**
          if-no-files-found: warn
          retention-days: 14
