
name: Ad Astra Fabric Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Ad-Astra-26.3-Fabric-port-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extraer el port preparado
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work
          unzip -q Ad-Astra-26.3-Fabric-port-source.zip -d work
          test -f work/Ad-Astra/gradlew
          test -f work/Common-Storage-Lib/settings.gradle.kts
          test -f work/Athena/settings.gradle.kts

      - name: Corregir inclusiones duplicadas
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("work/Common-Storage-Lib/settings.gradle.kts")
          s = p.read_text()

          duplicates = [
              'includePlatformModule("data", "common")',
              'includePlatformModule("data", "fabric")',
              'includePlatformModule("lookup", "common")',
              'includePlatformModule("lookup", "fabric")',
              'includePlatformModule("resources", "common")',
              'includePlatformModule("resources", "fabric")',
          ]

          for entry in duplicates:
              s = s.replace(entry + "\n", "")

          p.write_text(s)
          print("Inclusiones duplicadas corregidas.")
          PY

      - name: Adaptar Cloche a un único objetivo Fabric
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("work/Ad-Astra/build.gradle.kts")
          s = p.read_text()

          target = '    fabric {\n        val fabricLoaderVersion: String by project'
          if target not in s:
              raise SystemExit("No se encontró el bloque fabric esperado.")

          s = s.replace(
              target,
              '    singleTarget {\n    fabric {\n        val fabricLoaderVersion: String by project',
              1
          )

          marker = '\n    targets.all {'
          if marker not in s:
              raise SystemExit("No se encontró el bloque targets.all.")

          s = s.replace(marker, '\n    }\n\n    targets.all {', 1)
          p.write_text(s)
          print("Configuración singleTarget aplicada.")
          PY

      - name: Compilar Ad Astra
        working-directory: work/Ad-Astra
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon build --stacktrace

      - name: Publicar JAR e informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-astra-fabric-26.3-build
          path: |
            work/Ad-Astra/build/libs/*.jar
            work/Ad-Astra/build/reports/**
            work/Ad-Astra/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
