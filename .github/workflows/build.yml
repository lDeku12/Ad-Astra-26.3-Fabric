name: Ad Astra Fabric Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Ad-Astra-26.3-Fabric-port-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Extraer y localizar Ad Astra
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work
          unzip -q Ad-Astra-26.3-Fabric-port-source.zip -d work

          echo "Estructura del ZIP:"
          find work -maxdepth 4 -type f \( \
            -name 'build.gradle' -o \
            -name 'build.gradle.kts' -o \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' -o \
            -name 'gradlew' \
          \) -print

          PROJECT_DIR=""

          while IFS= read -r BUILD_FILE; do
            DIR="$(dirname "$BUILD_FILE")"

            if [ -f "$DIR/gradlew" ] &&
               { [ -f "$DIR/settings.gradle" ] || [ -f "$DIR/settings.gradle.kts" ]; } &&
               [ -d "$DIR/src" ] &&
               [ ! -d "$DIR/Athena" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find work -type f \
              \( -name 'build.gradle' -o -name 'build.gradle.kts' \) \
              -not -path '*/Athena/*' -print
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se pudo identificar la raíz del proyecto Ad Astra."
            echo "Archivos Gradle encontrados:"
            find work -type f \( \
              -name 'build.gradle' -o \
              -name 'build.gradle.kts' -o \
              -name 'settings.gradle' -o \
              -name 'settings.gradle.kts' -o \
              -name 'gradlew' \
            \) -print
            exit 1
          fi

          echo "Proyecto seleccionado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Corregir Common-Storage-Lib Fabric build.gradle.kts
        shell: bash
        run: |
          set -euo pipefail
          TARGET_FILE="$PROJECT_DIR/Common-Storage-Lib/core/fabric/build.gradle.kts"
          
          if [ -f "$TARGET_FILE" ]; then
            echo "Encontrado $TARGET_FILE, aplicando corrección..."
            cat << 'EOF' > "$TARGET_FILE"
          include("teamreborn:energy:4.1.0") {
              exclude(
                  group = "net.fabricmc",
                  module = "fabric-api"
              )
          }
          EOF
            echo "Corrección aplicada con éxito."
          else
            echo "Aviso: No se encontró el archivo exacto en $TARGET_FILE, buscando alternativas..."
            find "$PROJECT_DIR" -name "fabric" -type d | while read -r d; do
              if [ -f "$d/build.gradle.kts" ]; then
                echo "Revisando: $d/build.gradle.kts"
              fi
            done
          fi

      - name: Compilar Ad Astra
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          chmod +x ./gradlew

          echo "Compilando desde: $(pwd)"
          ./gradlew --no-daemon build --stacktrace

      - name: Mostrar JAR generados
        if: always()
        shell: bash
        run: |
          echo "JAR encontrados:"
          find work -type f -path '*/build/libs/*.jar' -print || true

      - name: Guardar JAR e informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-astra-fabric-26.3-build
          path: |
            work/**/build/libs/*.jar
            work/**/build/reports/**
            work/**/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
