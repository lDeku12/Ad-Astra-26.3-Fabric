name: Ad Astra Fabric Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Ad-Astra-26.3-Fabric-port-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extraer las fuentes
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work
          unzip -q Ad-Astra-26.3-Fabric-port-source.zip -d work
          test -f work/Ad-Astra/gradlew
          test -f work/Ad-Astra/build.gradle.kts

      - name: Compilar Ad Astra
        working-directory: work/Ad-Astra
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon build --stacktrace

      - name: Guardar JAR e informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-astra-fabric-26.3-build
          path: |
            work/Ad-Astra/build/libs/*.jar
            work/Ad-Astra/build/reports/**
            work/Ad-Astra/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
