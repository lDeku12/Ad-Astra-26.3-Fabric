name: Ad Astra Fabric Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Ad-Astra-26.3-Fabric-port-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extraer y localizar el proyecto
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p work
          unzip -q Ad-Astra-26.3-Fabric-port-source.zip -d work

          echo "Contenido extraído:"
          find work -maxdepth 4 -type f | head -200

          GRADLEW="$(find work -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No se encontró gradlew dentro del ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          if [ ! -f "$PROJECT_DIR/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "ERROR: Se encontró gradlew, pero no el archivo build.gradle o build.gradle.kts en esa carpeta."
            echo "Carpeta encontrada: $PROJECT_DIR"
            find work -maxdepth 5 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \)
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar Ad Astra
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon build --stacktrace

      - name: Guardar JAR e informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-astra-fabric-26.3-build
          path: |
            work/**/build/libs/*.jar
            work/**/build/reports/**
            work/**/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
```
