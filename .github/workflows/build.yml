```yaml
name: Ad Astra Fabric Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Ad-Astra-26.3-Fabric-port-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extraer las fuentes
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work
          unzip -q Ad-Astra-26.3-Fabric-port-source.zip -d work
          test -f work/Ad-Astra/gradlew
          test -f work/Ad-Astra/build.gradle.kts

      - name: Configurar Cloche para Fabric
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("work/Ad-Astra/build.gradle.kts")
          s = p.read_text()

          if "singleTarget {" in s:
              print("Ya existe singleTarget; no se modifica.")
              raise SystemExit(0)

          common = "    common {"
          fabric = "    fabric {"
          targets = "    targets.all {"

          if s.count(common) != 1:
              raise SystemExit("No se encontró exactamente un bloque common.")
          if s.count(fabric) != 1:
              raise SystemExit("No se encontró exactamente un bloque fabric.")
          if s.count(targets) != 1:
              raise SystemExit("No se encontró exactamente un bloque targets.all.")

          start = s.index(common)
          end = s.index(targets)

          if s.index(fabric) < start or s.index(fabric) > end:
              raise SystemExit("El bloque fabric no está junto al bloque common.")

          s = s[:start] + "    singleTarget {\n" + s[start:end] + "    }\n\n" + s[end:]
          p.write_text(s)
          print("Bloques common y fabric agrupados en singleTarget.")
          PY

      - name: Compilar Ad Astra
        working-directory: work/Ad-Astra
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon build --stacktrace

      - name: Guardar JAR e informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-astra-fabric-26.3-build
          path: |
            work/Ad-Astra/build/libs/*.jar
            work/Ad-Astra/build/reports/**
            work/Ad-Astra/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
```
