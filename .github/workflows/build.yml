
name: Ad Astra Fabric Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Ad-Astra-26.3-Fabric-port-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Extraer y localizar Ad Astra
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work
          unzip -q Ad-Astra-26.3-Fabric-port-source.zip -d work

          echo "Buscando el proyecto de Ad Astra..."

          PROJECT_DIR=""

          while IFS= read -r BUILD_FILE; do
            DIR="$(dirname "$BUILD_FILE")"

            if [ -f "$DIR/gradlew" ] &&
               [ -f "$DIR/settings.gradle" ] &&
               [ -d "$DIR/src" ] &&
               [ ! -d "$DIR/Athena" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find work -type f -name build.gradle -not -path '*/Athena/*' -print)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró la carpeta raíz de Ad Astra."
            echo "Proyectos Gradle encontrados:"
            find work -type f \( -name build.gradle -o -name settings.gradle -o -name gradlew \) -print
            exit 1
          fi

          echo "Proyecto seleccionado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar Ad Astra
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          echo "Directorio de compilación:"
          pwd

          echo "Ejecutando Gradle..."
          ./gradlew --no-daemon build --stacktrace

      - name: Mostrar JAR generados
        if: always()
        shell: bash
        run: |
          echo "Archivos JAR encontrados:"
          find work -type f -path '*/build/libs/*.jar' -print || true

      - name: Guardar JAR e informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-astra-fabric-26.3-build
          path: |
            work/**/build/libs/*.jar
            work/**/build/reports/**
            work/**/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
